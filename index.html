// 3. 核心评估引擎
// ==========================================
function getFinalPersonality(scores, isSharingPhase = false) {
  const roll = Math.random() * 100;
  const multiplier = isSharingPhase ? 2.0 : 1.0; 

  // 🎯 为三大隐藏卡独立声明基础概率，并乘上分享复活系数
  const mesThresh = 30.0 * multiplier; // MES 基础 30%
  const cr7Thresh = 30.0 * multiplier; // CR7 基础 30%
  const cnaThresh = 40.0 * multiplier; // CNA 基础 40%

  // ==========================================
  // 🔒 隐藏人格触发规则（独立动态概率版）
  // ==========================================
  
  // 1. MES 梅老板：在 0 ~ mesThresh 区间内摇号
  if (scores.FISH >= 5 && scores.CHAOS <= 2 && scores.AMBITION >= 4 && scores.SOCIAL <= 6) {
    if (roll < mesThresh) { return "MES"; } 
  }
  
  // 2. CR7 罗总裁：在 33 ~ (33 + cr7Thresh) 区间内摇号（完美避开 MES 的最大值 30）
  if (scores.AMBITION >= 8 && scores.EGO >= 8 && scores.RESPONSIBLE >= 5 && scores.FISH <= 3) {
    if (roll >= 33.0 && roll < (33.0 + cr7Thresh)) { return "CR7"; }
  }
  
  // 3. CNA 东国队：在 60 ~ (60 + cnaThresh) 区间内摇号（给足 40 度的独立空间）
  if (scores.CHAOS >= 8 && scores.RESPONSIBLE <= 4 && scores.FISH >= 4 && scores.AMBITION <= 2) {
    if (roll >= 60.0 && roll < (60.0 + cnaThresh)) { return "CNA"; }
  }

  // 4. DEALMOON 羊毛尊者彩蛋（保持原样）
  const realQ14Idx = questionsDatabase.findIndex(q => q.id === 14);
  const realQ15Idx = questionsDatabase.findIndex(q => q.id === 15);
  const q14Ans = window.userAnswers[realQ14Idx];
  const q15Ans = window.userAnswers[realQ15Idx];
  const meetsConditions = (q14Ans === 0 && (q15Ans === 0 || q15Ans === 1));

  if (meetsConditions) {
     if (roll >= 96.0 && roll < (96.0 + 4.0 * (isSharingPhase ? 2.5 : 1.0))) { return "DEALMOON"; }
  }

  // ==========================================
  // 后续的 Z-Score 及常规 16 人格距离匹配（保持原样，无需变动）
  // ==========================================
  const GLOBAL_MEANS = { AMBITION: 3.5, RESPONSIBLE: 4.5, SOCIAL: 3.8, FISH: 4.2, CHAOS: 2.5, EGO: 3.0 };
  const GLOBAL_SDS = { AMBITION: 1.5, RESPONSIBLE: 1.8, SOCIAL: 1.5, FISH: 1.6, CHAOS: 1.2, EGO: 1.3 };
  const zScores = {};
  for (let dim in scores) {
     zScores[dim] = (scores[dim] - GLOBAL_MEANS[dim]) / GLOBAL_SDS[dim];
  }

  // ==========================================
  // 🛠️ 3. 算法修正：优化阵营判定逻辑（解决第3点：平滑非黑即白的扣分机制）
  //    保留你的 4 大阵营加权，但移除极端扣分项，避免偶尔选错一题就彻底踢出阵营。
  // ==========================================
  const campScores = {
    juan: (zScores.RESPONSIBLE * 1.2) + (zScores.AMBITION * 0.8),
    social: (zScores.SOCIAL * 1.5) + (zScores.AMBITION * 0.5),
    fish: (zScores.FISH * 1.8) + (zScores.EGO * 0.2),
    chaos: (zScores.CHAOS * 1.5) + (zScores.EGO * 0.8)
  };

  let topCamp = 'juan';
  let maxCampScore = -Infinity;
  for (let camp in campScores) {
    if (campScores[camp] > maxCampScore) { 
       maxCampScore = campScores[camp]; 
       topCamp = camp; 
    }
  }

  // ==========================================
  // 🛠️ 4. 算法修正：标准空间下的欧氏距离匹配（降维打击扎堆现象）
  //    【关键修正】原代码是用用户的 Z-Score 减去球星原始分（-1 减去 10 的几何灾难）。
  //    现在将球星的矩阵分数也映射到同一个 Z-Score 标准空间后再作对比。
  // ==========================================
  let candidatePool = CAMP_MAPPING[topCamp] || ['KANT', 'KROO', 'NEUE', 'HAAL'];
  let normalResult = candidatePool[0];
  let minDistance = Infinity;

  candidatePool.forEach(pKey => {
     const base = profile6DMatrix[pKey] || { AMBITION:5, RESPONSIBLE:5, SOCIAL:5, FISH:5, CHAOS:5, EGO:5 };
     
     // 将球星的原始分转化为其在 Z-Score 空间下的相对坐标
     const baseZ = {
       AMBITION: (base.AMBITION - GLOBAL_MEANS.AMBITION) / GLOBAL_SDS.AMBITION,
       RESPONSIBLE: (base.RESPONSIBLE - GLOBAL_MEANS.RESPONSIBLE) / GLOBAL_SDS.RESPONSIBLE,
       SOCIAL: (base.SOCIAL - GLOBAL_MEANS.SOCIAL) / GLOBAL_SDS.SOCIAL,
       FISH: (base.FISH - GLOBAL_MEANS.FISH) / GLOBAL_SDS.FISH,
       CHAOS: (base.CHAOS - GLOBAL_MEANS.CHAOS) / GLOBAL_SDS.CHAOS,
       EGO: (base.EGO - GLOBAL_MEANS.EGO) / GLOBAL_SDS.EGO
     };
     
     // 纯粹的同量级标准欧氏距离对比
     let distance = Math.sqrt(
         Math.pow(zScores.AMBITION - baseZ.AMBITION, 2) +
         Math.pow(zScores.RESPONSIBLE - baseZ.RESPONSIBLE, 2) +
         Math.pow(zScores.SOCIAL - baseZ.SOCIAL, 2) +
         Math.pow(zScores.FISH - baseZ.FISH, 2) +
         Math.pow(zScores.CHAOS - baseZ.CHAOS, 2) +
         Math.pow(zScores.EGO - baseZ.EGO, 2)
     );
     
     if (distance < minDistance) {
         minDistance = distance;
         normalResult = pKey;
     }
  });

  return normalResult;
}
function getCurrentLiveScores() {
  let totals = { AMBITION:0, SOCIAL:0, CHAOS:0, FISH:0, EGO:0, RESPONSIBLE:0 };
  userAnswers.forEach((ansIdx, qIdx) => {
    const s = questionsDatabase[qIdx].options[ansIdx].score;
    for (let dim in s) { totals[dim] += s[dim]; }
  });
  return totals;
}

function calculateCyberPrice(personalityKey, userScores) {
  const tier = rankTiers[personalityKey] || { base: 70000000 };
  if (['DEALMOON', 'MES', 'CR7', 'CNA'].includes(personalityKey)) return tier.base;
  const delta = ((userScores.AMBITION || 2) * 1500000) + ((userScores.RESPONSIBLE || 2) * 1200000) - ((userScores.FISH || 2) * 2000000);
  return Math.floor(Math.min(tier.base * 1.15, Math.max(tier.base * 0.85, tier.base + delta)));
}

function getBeatPercentage(personalityKey, price) {
  const tier = rankTiers[personalityKey] || { minP: 40.0, maxP: 49.9 };
  const ratio = (price - tier.base) / (tier.base * 0.15 || 1);
  let percent = tier.minP + (tier.maxP - tier.minP) * (0.5 + Math.max(-0.5, Math.min(0.5, ratio)));
  return percent.toFixed(1) + "%";
}

function calculateMadIndex(personalityKey, userScores) {
  if (personalityKey === 'DEALMOON') return 68; if (personalityKey === 'CNA') return 95; if (personalityKey === 'BALO' || personalityKey === 'SUAR') return 99;
  let baseMad = ((userScores.CHAOS || 2) * 12) + ((userScores.EGO || 2) * 6);
  return Math.max(15, Math.min(98, baseMad));
}

function escapeHTML(str) { return str.replace(/[&<>"'/]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;','/':'&#x2F;'}[m])); }

  toast.innerHTML = `<span>🔔</span> <span>${message}</span>`;

  setTimeout(() => toast.remove(), 1800);

function getTargetRedirectUrl() {
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  if (/android/i.test(userAgent)) {

        return "https://www.dealmoon.ca/?s=twitter_ad_deal_469047_20260611&utm_source=twitter&utm_medium=social&utm_campaign=twitter_ad_deal_469047_20260611&x_from_site=ca&topdeal=469047";
     }
     return "https://play.google.com/store/apps/details?id=com.dealmoon.android&hl=en_CA";
  }
  if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
     return "https://apps.apple.com/app/id867845107";
  }
  return "https://www.dealmoon.ca/?s=twitter_ad_deal_469047_20260611&utm_source=twitter&utm_medium=social&utm_campaign=twitter_ad_deal_469047_20260611&x_from_site=ca&topdeal=469047";
}

function executeCopyText(text) {
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    return navigator.clipboard.writeText(text)
      .then(() => true)
      .catch(() => fallbackCopyText(text)); 
  } else {
    return Promise.resolve(fallbackCopyText(text));
  }
}

function fallbackCopyText(text) {
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '0';
    textarea.style.left = '0';
    textarea.style.width = '1px';
    textarea.style.height = '1px';
    textarea.style.padding = '0';
    textarea.style.border = 'none';
    textarea.style.outline = 'none';
    textarea.style.boxShadow = 'none';
    textarea.style.background = 'transparent';
    
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length); 
    
    const success = document.execCommand('copy');
    document.body.removeChild(textarea);
    return !!success;
  } catch (err) {
    console.error("降级复制依然被拦截:", err);
    return false;
  }
}

function prepareQuestionsAndInit() {
  const fixedIds = [1, 2, 3, 14, 15];
  let poolToShuffle = questionsDatabase.filter(q => !fixedIds.includes(q.id));
  for (let i = poolToShuffle.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [poolToShuffle[i], poolToShuffle[j]] = [poolToShuffle[j], poolToShuffle[i]];
  }
  const finalOrderedQuestions = [];
  const q1 = questionsDatabase.find(q => q.id === 1);
  const q2 = questionsDatabase.find(q => q.id === 2);
  const q3 = questionsDatabase.find(q => q.id === 3);
  const q14 = questionsDatabase.find(q => q.id === 14);
  const q15 = questionsDatabase.find(q => q.id === 15);
  
  let poolIdx = 0;
  for (let i = 0; i < questionsDatabase.length; i++) {
    if (i === 0) finalOrderedQuestions.push(q1);        
    else if (i === 1) finalOrderedQuestions.push(q2);   
    else if (i === 2) finalOrderedQuestions.push(q3);   
    else if (i === 13) finalOrderedQuestions.push(q14); 
    else if (i === 14) finalOrderedQuestions.push(q15); 
    else { finalOrderedQuestions.push(poolToShuffle[poolIdx++]); }
  }
  questionsDatabase.length = 0; questionsDatabase.push(...finalOrderedQuestions);
  renderQuestionPage();
}
